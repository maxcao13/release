base_images:
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
binary_build_commands: make binary
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/aws-karpenter-provider-aws
images:
  items:
  - dockerfile_path: openshift/Containerfile.rhel
    to: aws-karpenter-provider-aws
promotion:
  to:
  - name: "5.0"
    namespace: ocp-priv
prowgen:
  enable_secrets_store_csi_driver: true
  private: true
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp-priv
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: |
    set -euo pipefail
    export GOCACHE=/tmp/gocache
    export GOBIN=/tmp/bin
    # Pin setup-envtest to a revision compatible with Go 1.23 on older release branches.
    GOFLAGS=-mod=mod go install sigs.k8s.io/controller-runtime/tools/setup-envtest@32e5e9e948a572779280969aaaf7db92f76d8252
    # Match the local API server to this branch's Kubernetes dependencies.
    K8S_VERSION="$(go list -m -f '{{.Version}}' k8s.io/api | awk -F '[v.]' '{printf "1.%d.x", $3}')"
    export K8S_VERSION
    KUBEBUILDER_ASSETS="$("${GOBIN}/setup-envtest" use -p path "${K8S_VERSION}" --bin-dir=/tmp/envtest)"
    export KUBEBUILDER_ASSETS
    make test
  container:
    from: bin
- always_run: false
  as: e2e-aws
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws
- as: e2e-hypershift
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|OWNERS_ALIASES|LICENSE)$
  steps:
    cluster_profile: hypershift-aws
    env:
      TEST_PLAN: |
        name: autonode-e2e
        platform: aws
        testMatrix:
          parallel:
          - name: karpenter
            variant: karpenter
            labelFilter: karpenter
          - name: karpenter-upgrade
            variant: karpenter-upgrade
            labelFilter: karpenter-upgrade
    workflow: hypershift-aws-e2e-v2
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: release-5.0
  org: openshift-priv
  repo: aws-karpenter-provider-aws
