base_images:
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
binary_build_commands: make openshift-toolchain
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: openshift/Containerfile.rhel
    to: azure-karpenter-provider-azure
promotion:
  to:
  - name: "5.1"
    namespace: ocp
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
- as: verify
  commands: GOLANGCI_LINT_CACHE=/tmp/.cache make openshift-verify KARPENTER_CORE_DIR=vendor/sigs.k8s.io/karpenter
  container:
    from: bin
- as: unit
  commands: make openshift-test
  container:
    from: bin
- always_run: false
  as: e2e-azure-hypershift
  pipeline_skip_if_only_changed: ^docs/|^\.github|\.md$|\.mdc$|^(?:.*/)?(?:\.gitignore|\.coderabbit\.yaml|OWNERS|OWNERS_ALIASES|PROJECT|LICENSE)$
  steps:
    cluster_profile: hypershift-azure
    env:
      ENABLE_STANDALONE_KARPENTER_OPERATOR: "true"
      TECH_PREVIEW_NO_UPGRADE: "true"
      TEST_PLAN: |
        name: autonode
        platform: azure
        testMatrix:
          parallel:
          - name: karpenter
            variant: karpenter
            labelFilter: karpenter
          - name: karpenter-upgrade
            variant: karpenter-upgrade
            labelFilter: karpenter-upgrade
    workflow: hypershift-azure-e2e-v2-self-managed
zz_generated_metadata:
  branch: main
  org: openshift
  repo: Azure-karpenter-provider-azure
